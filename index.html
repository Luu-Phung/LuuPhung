<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP XEP DAY SO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            height: auto;
            background: linear-gradient(135deg, #00c9ff, #92fe9d);
            margin: 0;
            overflow: hidden;
        }

        #number-container {
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: clamp(10px, 4vw, 20px);
            border-radius: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.4s;
        }

        #number-container:hover {
            transform: scale(1.03);
        }

        .number {
            width: clamp(50px, 8vw, 60px);
            height: clamp(35px, 8vw, 60px);
            background: linear-gradient(135deg, #00c9ff, #92fe9d);
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: 600;
            cursor: grab;
            user-select: none;
            border-radius: 20px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.4s, box-shadow 0.4s;
        }

        .number:active {
            transform: scale(1.15);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .number:hover {
            background: linear-gradient(135deg, #00c9ff, #92fe9d);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        #restart-button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: clamp(14px, 3vw, 18px);
            background-color: #00c9ff;
            color: #333;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        #restart-button:hover {
            background-color: #92fe9d;
        }

        h1 {
            font-size: clamp(30px, 5vw, 40px);
            color: #2f4f4f; /* Màu xám xanh đậm dịu mắt */
            text-transform: uppercase;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.2); /* Giảm độ chói của bóng */
            font-weight: 800;
            font-family: 'Roboto', sans-serif;
        }

        button {
            text-transform: uppercase; /* In hoa toàn bộ chữ */
        }

        /* CSS responsive cho mobile */
        @media only screen and (max-width: 768px) {
            #number-container {
                /* Đổi sang cột để hiển thị tốt hơn trên mobile */
                width: 100%;
                gap: 15px;
            }

            body {
                padding: 10px; /* Thêm khoảng cách để không bị tràn màn hình */
            }

            .number {
                font-size: clamp(20px, 5vw, 28px); /* Giảm kích thước font để phù hợp với màn hình nhỏ */
            }

            #restart-button {
                width: 100%;
                margin-top: 15px;
            }

            #start-screen button {
                width: 90%;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body style="flex-direction: column;">
    <div id="start-screen"
        style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; height: auto; background: linear-gradient(135deg, #00c9ff, #92fe9d); position: absolute; top: 0; left: 0; width: 100%; width: 100vw; overflow-x: hidden; box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5);">
        <h1>✨ SAP XEP DAY SO ✨</h1>
        <button onclick="startGame()"
            style="margin-top: 30px; background-color: #00c9ff; color: #333333; border: none; padding: clamp(15px, 4vw, 25px) clamp(30px, 8vw, 50px); font-size: clamp(14px, 3vw, 18px); border-radius: 15px; cursor: pointer; transition: background-color 0.3s, color 0.3s; box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);">
            🎮 Bắt Đầu Chơi 🎮
        </button>
    </div>
    <div id="game-info" style="text-align: center; margin-bottom: 20px;">
        <div id="timer"
            style="font-size: clamp(14px, 3vw, 18px); color: #333333; margin-bottom: 15px; text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);">
            ⏱ Thời gian: <span id="time">30</span> giây
        </div>
        <h1>✨ SAP XEP DAY SO ✨</h1>
        <p style="font-size: clamp(14px, 3vw, 18px); color: #333333; margin: 0 auto; text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.3); font-style: italic;">Kéo và thả các ô số để sắp xếp dãy số theo thứ tự tăng dần.</p>
    </div>
    <div id="number-container">
        <!-- Các số sẽ được tạo tự động bằng JavaScript -->
    </div>
    <button id="restart-button" style="display: none;" onclick="restartGame()">🔄 Chơi Lại</button>

    <!-- Thêm âm thanh đồng hồ -->
    <audio id="tick-sound" src="tick.mp3" preload="auto"></audio>

    <script>
        let numbers;
        const container = document.getElementById('number-container');
        const restartButton = document.getElementById('restart-button');
        let timeLeft = 30; // Bắt đầu từ 30 giây
        let timerInterval;
        let gameCompleted = false; // Trạng thái của trò chơi
        const tickSound = document.getElementById('tick-sound'); // Âm thanh đồng hồ

        function createNumberElements() {
            container.innerHTML = '';
            numbers.forEach((number, index) => {
                const numberElement = document.createElement('div');
                numberElement.classList.add('number');
                numberElement.draggable = true;
                numberElement.textContent = number;
                numberElement.dataset.index = index;

                // Sự kiện khi bắt đầu kéo
                numberElement.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', index);
                });

                // Sự kiện kéo vào phần tử khác
                numberElement.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });

                // Sự kiện thả vào phần tử khác
                numberElement.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const fromIndex = e.dataTransfer.getData('text/plain');
                    const toIndex = e.target.dataset.index;

                    // Hoán đổi vị trí hai số
                    [numbers[fromIndex], numbers[toIndex]] = [numbers[toIndex], numbers[fromIndex]];
                    createNumberElements();

                    // Kiểm tra nếu dãy số đã được sắp xếp
                    if (isSorted(numbers)) {
                        setTimeout(() => {
                            stopTimer();
                            gameCompleted = true; // Đánh dấu trò chơi đã hoàn thành
                            alert('Chúc mừng! Bạn đã sắp xếp đúng dãy số.');
                            restartButton.style.display = 'block'; // Hiển thị nút Chơi Lại
                        }, 100);
                    }
                });

                container.appendChild(numberElement);
            });
        }

        function isSorted(arr) {
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] > arr[i + 1]) {
                    return false;
                }
            }
            return true;
        }

        function startTimer() {
            document.getElementById('time').textContent = timeLeft; // Hiển thị thời gian ban đầu
            timerInterval = setInterval(() => {
                if (!gameCompleted) { // Chỉ phát âm thanh nếu trò chơi chưa hoàn thành
                    timeLeft--;
                    document.getElementById('time').textContent = timeLeft;
                    tickSound.play(); // Phát âm thanh mỗi khi giảm 1 giây
                    if (timeLeft <= 0) {
                        stopTimer();
                        alert('Hết giờ! Bạn đã thất bại.');
                        restartButton.style.display = 'block'; // Hiển thị nút Chơi Lại
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function startGame() {
            // Reset trạng thái trò chơi
            gameCompleted = false;
            // Mỗi lần bắt đầu trò chơi mới, xáo trộn lại dãy số
            numbers = Array.from({ length: 11 }, (_, i) => i + 5).sort(() => Math.random() - 0.5).slice(0, 8);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-info').style.display = 'block';
            document.getElementById('number-container').style.display = 'flex';
            restartButton.style.display = 'none'; // Ẩn nút Chơi Lại khi bắt đầu trò chơi mới
            timeLeft = 30; // Reset lại thời gian đếm ngược
            document.getElementById('time').textContent = timeLeft;
            createNumberElements(); // Tạo lại dãy số mới
            startTimer();
        }

        function restartGame() {
            document.getElementById('start-screen').style.display = 'flex'; // Quay lại màn hình bắt đầu
            document.getElementById('game-info').style.display = 'none';
            document.getElementById('number-container').style.display = 'none';
            stopTimer();
        }

        document.getElementById('game-info').style.display = 'none';
        document.getElementById('number-container').style.display = 'none';
    </script>

</body>

</html>
